[project]
name = "atelieros"
version = "0.1.0"
description = "Designer-controlled garment revisions and approvals"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",
  "alembic>=1.15,<2",
  "pillow>=13,<14",
  "langgraph>=1,<2",
  "httpx>=0.28,<1",
  "reportlab>=4,<5",
  "python-docx>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "jsonschema>=4.23,<5",
    "pip-audit>=2.9,<3",
    "pypdf>=7.0.0",
    "pymupdf>=2.1",
    "types-reportlab>=5.1.0.20261104",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api", "packages/domain"]

